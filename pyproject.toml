[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbshift"
version = "0.1.0"
description = "Cross-site robustness of hand-crafted vs deep representations for TB chest X-ray screening"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
